services:
  db:
    image: postgres:15-alpine
    container_name: attendx-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendx}
      POSTGRES_USER: ${POSTGRES_USER:-attendx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendx_secure_pass_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-attendx} -d ${POSTGRES_DB:-attendx}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: attendx-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: attendx-backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-attendx}:${POSTGRES_PASSWORD:-attendx_secure_pass_2026}@db:5432/${POSTGRES_DB:-attendx}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-attendx}:${POSTGRES_PASSWORD:-attendx_secure_pass_2026}@db:5432/${POSTGRES_DB:-attendx}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    container_name: attendx-celery
    restart: always
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "-c", "2"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-attendx}:${POSTGRES_PASSWORD:-attendx_secure_pass_2026}@db:5432/${POSTGRES_DB:-attendx}
      - DATABASE_URL_SYNC=postgresql://${POSTGRES_USER:-attendx}:${POSTGRES_PASSWORD:-attendx_secure_pass_2026}@db:5432/${POSTGRES_DB:-attendx}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_PROXY_TARGET: http://backend:8000
    container_name: attendx-frontend
    restart: always
    env_file:
      - .env
    environment:
      - API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  nginx:
    image: nginx:alpine
    container_name: attendx-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
